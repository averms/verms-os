version = '1.0'

[rqq]
type = 'command'
attached_command = 'repoquery'
complete = true
attached_named_args = [
    { id_path = 'repoquery.latest-limit', value = '1' },
    { id_path = 'repoquery.arch', value = 'x86_64,noarch' },
]

['repoquery.I']
type = 'cloned_named_arg'
short_name = 'I'
source = 'repoquery.installed'

['repoquery.csv']
type = 'named_arg'
long_name = 'csv'
[['repoquery.csv'.attached_named_args]]
id_path = 'repoquery.queryformat'
value = '%{name},%{version},%{reason},%{arch},%{from_repo},%{installsize}\n'
